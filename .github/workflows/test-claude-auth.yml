name: Test Claude Auth (temporary)

# Throwaway smoke test: confirms CLAUDE_CODE_OAUTH_TOKEN authenticates against
# the Anthropic API via claude-code-action, without touching the repo.
# Safe to delete once auth is confirmed green.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run a trivial prompt
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6'
          show_full_output: true
          prompt: 'Reply with exactly: AUTH_OK'

      - name: Assert the agent authenticated
        run: |
          echo "conclusion=${{ steps.claude.outputs.conclusion }}"
          if [ "${{ steps.claude.outputs.conclusion }}" != "success" ]; then
            echo "::error::Auth smoke test failed — token still invalid."
            exit 1
          fi
          echo "Auth OK."
