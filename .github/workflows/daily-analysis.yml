name: Daily Job Analysis

# Runs the scoring/analysis agent right after the daily search finishes,
# replacing the claude.ai cloud routine (CCR) that never ran reliably.
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (create with: claude setup-token).
on:
  workflow_run:
    workflows: ["Daily Job Search"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets check_freshness.py re-trigger the search workflow if data is stale
  id-token: write  # required by claude-code-action@v1 for OIDC token exchange

jobs:
  analyze:
    # On schedule-chained runs, only proceed if the search succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip if analysis for today already exists
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "analysis/analysis_${TODAY}.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "analysis_${TODAY}.md already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run analysis agent
        id: claude
        if: steps.guard.outputs.exists == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Pass the token explicitly so the action uses it directly instead of
          # exchanging the OIDC token for a Claude GitHub App token (the App is
          # not installed on this repo, which 401'd the App-token exchange).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # OAuth token from `claude setup-token`. NOTE: these tokens expire —
          # if the agent step logs "401 Invalid bearer token", regenerate it and
          # update the CLAUDE_CODE_OAUTH_TOKEN repo secret. The Verify step below
          # turns such failures into a red build instead of a silent no-op.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model claude-sonnet-4-6'
          show_full_output: true   # keep on: makes auth/agent failures debuggable in the run log
          prompt: |
            You are a daily job search assistant for Sheila Muñoz Gallardo.

            ## Step 0 — Ensure fresh data

            Run `python3 check_freshness.py`. It verifies compact_jobs.json has
            today's results and re-triggers the search workflow if stale (it can
            use the GITHUB_TOKEN env var). It always exits successfully.

            ## Step 1 — Read compact_jobs.json

            Each entry has: title, url, published, snippet.
            If `total_new` is 0: write a brief analysis/analysis_YYYY-MM-DD.md
            noting that, then go straight to Step 4b.

            ## Step 2 — Score each posting from the snippet

            Read CLAUDE.md in the repo root first — it contains the candidate
            profile refinements and overriding discard rules.

            ### Candidate Profile — Sheila Muñoz Gallardo
            - 7+ years ML, EU resident (currently Spain) with full EU work
              authorization, no US visa. OPEN TO RELOCATING TO PORTUGAL.
            - Skills: Python, XGBoost, LightGBM, GAMs, scikit-learn, SHAP, SQL,
              AWS/SageMaker, MLOps, probabilistic forecasting, A/B testing,
              causal inference
            - Recent: automated ML trading engine for Polymarket (prediction markets)
            - Previous: Founding DS at Justos (insurtech) — end-to-end pricing &
              risk ML, 16+ models
            - Also: McKinsey (stochastic optimization), IBM (fraud detection)
            - Education: MSc + PhD coursework in Mathematics
            - NO LLM/NLP experience — open to learning if role otherwise fits
            - Salary floors (EUR, ~10% flexibility): employee/permanent 75K EUR,
              freelance/contractor 90K EUR
            - Location, ranked by preference: (1) fully remote global — ideal;
              (2) EU remote / remote-from-EU — KEEP; (3) Portugal-based onsite,
              hybrid or remote-from-PT (Lisbon/Porto incl.) — KEEP, but apply a
              small interest penalty (~ -1) since it requires relocating
            - Roles: Senior Data Scientist / Applied Scientist / ML Engineer
            - Open to ANY industry

            ### Scoring
            - match (0–10): skills vs hard requirements
            - interest (0–10): technical challenge, production ML depth, IC
              autonomy, team quality, novel methods. Industry irrelevant.
            - combined = 0.55 × match + 0.45 × interest

            ### DISCARD (combined = 0):
            - Not a real job posting (article, profile, broken page)
            - On-site or hybrid required OUTSIDE Portugal (Portugal onsite/hybrid
              is KEEP — see Location below)
            - Wrong role type: pure SWE, PM, designer, sales, pure data analyst
              with no modeling, actuarial; even in crypto: quant trader, market
              maker, AMM developer, protocol researcher
            - Salary clearly below the floor — employee <75K EUR or
              freelance/contractor <90K EUR by more than ~10%. Within ~10% under
              → FLAG not discard. Salary unstated → do NOT discard on salary.
              Contract type unstated → assume employee (75K EUR).
            - "US Remote" / US states — DISCARD unless explicit sponsorship,
              contractor open to international
            - "UK Remote" — same rule as US (UK is non-EU); read full content
              from jobs_raw.json for any UK role before discarding
            - Country-specific work authorization (outside EU/Portugal) without
              sponsorship path

            ### Location KEEP (additive — global remote is still ideal):
            - Fully remote global → KEEP, no penalty
            - EU remote / "Remote — Europe" / remote-from-EU → KEEP (she is
              EU-based), little-to-no penalty
            - Portugal onsite/hybrid/remote-from-PT → KEEP, small interest
              penalty (~ -1) for relocation. Surface these as fallbacks.

            ### FLAG:
            - LLM/NLP hard required
            - Salary within ~10% under the relevant floor
            - Remote policy ambiguous (US/UK company, just says "Remote")

            ## Step 3 — For jobs ≥ 7.0 (and US/UK borderline), read full content

            Find the entry in jobs_raw.json by url and read its `content` field.

            ## Step 4 — Write analysis/analysis_YYYY-MM-DD.md

            Use the date from compact_jobs.json["date"]. Structure:
            title + counts line; "Top Jobs (combined ≥ 6.0)" table
            (Rank|Combined|Match|Interest|Role|Company|Sector|Remote|URL);
            "Detailed Notes (combined ≥ 7.0)" per job (Why it fits / Gaps /
            Key requirements / Remote policy / Verdict); "Flagged" table;
            "Discarded" table (Title|Reason).

            ## Step 4b — Commit and push the analysis

            git config user.email "bot@job-finder"
            git config user.name "Job Finder Bot"
            git add analysis/ && git commit -m "Daily analysis $(date -u +%Y-%m-%d)"
            git push origin main

            ## Step 5 — Update seen.json, commit, push

            Append ALL urls from compact_jobs.json to seen.json as
            {"url": ..., "date": "YYYY-MM-DD"}; drop entries older than 90 days.
            Commit ("Update seen.json YYYY-MM-DD") and push. If a push is
            rejected, fetch + merge origin/main and push again. VERIFY at the
            end that `git log origin/main..HEAD` is empty.

            This analysis is the only document Sheila reads in the morning to
            decide where to apply. Be thorough on the detailed notes.

      - name: Verify the analysis was actually produced
        # Turns a silently-failed agent (e.g. 401 Invalid bearer token, which
        # the action records as is_error: true but still exits 0) into a red
        # build. NB: the action's `conclusion` output is empty in prompt mode,
        # so we key off the execution log's is_error flag and the output file.
        if: steps.guard.outputs.exists == 'false'
        run: |
          LOG="${{ steps.claude.outputs.execution_file }}"
          [ -n "$LOG" ] && [ -f "$LOG" ] || LOG=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$LOG" ] && grep -q '"is_error": *true' "$LOG"; then
            echo "::error::Claude agent reported is_error=true. If the log shows '401 Invalid bearer token' or an invalid auth header, regenerate CLAUDE_CODE_OAUTH_TOKEN via 'claude setup-token' and paste it into the repo secret as a single line with no trailing newline."
            exit 1
          fi
          git pull --no-rebase origin main || true
          DATE=$(python3 -c "import json;print(json.load(open('compact_jobs.json'))['date'])")
          if [ ! -f "analysis/analysis_${DATE}.md" ]; then
            echo "::error::Agent finished without error but analysis/analysis_${DATE}.md was not produced/pushed. Investigate the agent step log."
            exit 1
          fi
          echo "OK: analysis/analysis_${DATE}.md is present."
