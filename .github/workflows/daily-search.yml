name: Daily Job Search

on:
  # PAUSED 2026-07-24 (por petición de Sheila): búsqueda diaria en pausa.
  # Para reanudar, descomenta el bloque `schedule` de abajo y haz push.
  # `workflow_dispatch` sigue activo para lanzarlo manualmente si hace falta.
  # schedule:
  #   - cron: '30 3 * * *'  # 3:30am UTC. Target: list ready by 3pm UTC+8 = 7am UTC.
  #                         # Early start gives ~3.5h buffer to absorb GitHub's cron
  #                         # queue delays (which hit twice: this run + the chained analysis).
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run job search
        run: python job_finder.py

      - name: Generate compact jobs for analysis agent
        run: |
          python3 - <<'EOF'
          import json, os, re
          from datetime import datetime

          with open("jobs_raw.json", encoding="utf-8") as f:
              data = json.load(f)

          seen = []
          if os.path.exists("seen.json"):
              with open("seen.json", encoding="utf-8") as f:
                  seen = json.load(f)
          seen_urls = {e["url"] for e in seen}

          # Hard filters applied before the agent sees anything
          US_REMOTE = re.compile(
              r"remote,?\s*usa|us\s*remote|united states.{0,20}remote|"
              r"\bremote,?\s*(AL|AK|AZ|AR|CA|CO|CT|DE|FL|GA|HI|ID|IL|IN|IA|KS|KY|"
              r"LA|ME|MD|MA|MI|MN|MS|MO|MT|NE|NV|NH|NJ|NM|NY|NC|ND|OH|OK|OR|PA|"
              r"RI|SC|SD|TN|TX|UT|VT|VA|WA|WV|WI|WY)\b",
              re.IGNORECASE,
          )
          HYBRID = re.compile(
              r"\bhybrid\b|on.?site|in.office|\d\s*days?.{0,10}office|"
              r"office.{0,10}\d\s*days?",
              re.IGNORECASE,
          )
          # Sheila is open to relocating to Portugal, so onsite/hybrid roles
          # there must survive the blanket hybrid/onsite pre-filter and reach
          # the scoring agent. (Lisbon/Porto/Lisboa included.)
          PORTUGAL = re.compile(
              r"\bportugal\b|\blisbon\b|\blisboa\b|\bporto\b|\balgarve\b",
              re.IGNORECASE,
          )
          NOT_JOB = re.compile(
              r"github\.com/[^/]+/[^/]+$|linkedin\.com/in/|linkedin\.com/posts/|"
              # Articles and news sites
              r"medium\.com|substack\.com|freecodecamp\.org|"
              r"gritdaily\.com|cointrenches\.io|theamericanreporter\.com|"
              r"theexecutiveoutlook\.com|analyticsindiamag\.com|"
              r"reinsurancene\.ws|crypto-economy\.com|cryptobriefing\.com|"
              r"crypto\.news/[^/]+-[^/]+-[^/]+|techtimes\.com|ibtimes\.|"
              r"jimmyalfonsolicon\.substack|"
              # Built In is a job board, but its articles/company-FAQ pages are not jobs
              r"builtin\.com/articles/|builtin\.com/company/|"
              # Other recurring non-posting noise
              r"\.ghost\.io|tatum\.io/blog|awebanalysis\.com|taodaily\.io|"
              r"cryptogrind\.com|voyagela\.com|dataglobalhub\.org|gamblingnews\.com|"
              # Personal profiles and CVs
              r"finextra\.com/bloggers|leaddev\.com/community|"
              r"infoworld\.com/profile|prepfully\.com/coaches|"
              r"jobicy\.com/cv/|mhausenblas\.info|"
              r"cryptojobslist\.com/@|remoteai\.io/v2/hire/",
              re.IGNORECASE,
          )

          filtered, pre_filtered = [], []
          for r in data["results"]:
              if r["url"] in seen_urls:
                  continue
              text = (r["title"] + " " + r["content"]).lower()
              url = r["url"]
              if NOT_JOB.search(url):
                  pre_filtered.append((r["title"], "not a job posting"))
                  continue
              if US_REMOTE.search(text):
                  pre_filtered.append((r["title"], "US remote"))
                  continue
              if HYBRID.search(text) and not PORTUGAL.search(text):
                  pre_filtered.append((r["title"], "hybrid/onsite"))
                  continue
              filtered.append(r)

          print(f"New: {len(filtered)} kept, {len(pre_filtered)} pre-filtered")
          for title, reason in pre_filtered:
              print(f"  PRE-FILTERED [{reason}]: {title[:70]}")

          compact = {
              "fetched_at": data["fetched_at"],
              "date": datetime.now().strftime("%Y-%m-%d"),
              "total_new": len(filtered),
              "pre_filtered": len(pre_filtered),
              "results": [
                  {
                      "title": r["title"],
                      "url": r["url"],
                      "published": r.get("published", ""),
                      "snippet": r["content"][:600].replace("\n", " "),
                  }
                  for r in filtered
              ],
          }

          with open("compact_jobs.json", "w", encoding="utf-8") as f:
              json.dump(compact, f, indent=2, ensure_ascii=False)

          print(f"compact_jobs.json written: {len(filtered)} jobs for agent")
          EOF

      - name: Commit results
        run: |
          git config user.email "bot@job-finder"
          git config user.name "Job Finder Bot"
          git add jobs_raw.json compact_jobs.json
          git diff --staged --quiet || git commit -m "Search results $(date +%Y-%m-%d)"
          git push
